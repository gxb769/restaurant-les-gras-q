name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SITE_URL: https://restaurant-les-gras-q.fr
          NEXT_PUBLIC_FORMSPREE_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ID }}

      - name: Test FTP credentials with curl
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Testing FTP connection..."
          curl -v --max-time 10 \
            --user "u800689494:${FTP_PASSWORD}" \
            "ftp://213.130.145.210/" \
            --list-only 2>&1 | grep -E "^[<>*]" | head -20

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "machine 213.130.145.210 login u800689494 password ${FTP_PASSWORD}" > ~/.netrc
          chmod 600 ~/.netrc
          printf '%s\n' \
            'set ftp:ssl-allow yes' \
            'set ftp:ssl-force no' \
            'set ssl:verify-certificate no' \
            'set net:timeout 30' \
            'set net:max-retries 3' \
            'set ftp:passive-mode yes' \
            'open 213.130.145.210' \
            'mirror -R --delete ./out/ /home/u800689494/domains/darksalmon-manatee-847606.hostingersite.com/public_html/' \
            'bye' \
            > /tmp/lftp_cmd.lftp
          lftp -f /tmp/lftp_cmd.lftp
